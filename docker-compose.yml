services:
  cdc-db:
    image: postgres:15-alpine
    container_name: cdc-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-cdc_db}
    volumes:
      - cdc-db-data:/var/lib/postgresql/data
    networks:
      - cdc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  cdc-app-api:
    build:
      context: ./cdc-app-api
      dockerfile: Dockerfile
    container_name: cdc-app-api
    ports:
      - "4101:4101"
    environment:
      - PORT=4101
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ACCESS_PUBLIC_KEY_GLIB=${ACCESS_PUBLIC_KEY_GLIB}
      - ACCESS_PRIVATE_KEY_GLIB=${ACCESS_PRIVATE_KEY_GLIB}
      - REFRESH_PUBLIC_KEY_GLIB=${REFRESH_PUBLIC_KEY_GLIB}
      - REFRESH_PRIVATE_KEY_GLIB=${REFRESH_PRIVATE_KEY_GLIB}
      - ACCESS_TOKEN_EXPIRES_IN=${ACCESS_TOKEN_EXPIRES_IN}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    restart: always
    depends_on:
      cdc-db:
        condition: service_healthy
    networks:
      - cdc-network
    volumes:
      - cdc-uploads:/app/uploads

  cdc-app-web:
    build:
      context: ./cdc-app-frontend/cdc-app-web
      dockerfile: Dockerfile
    container_name: cdc-app-web
    ports:
      - "4103:80"
    depends_on:
      - cdc-app-api
    restart: always
    networks:
      - cdc-network

  cdc-app-admin:
    build:
      context: ./cdc-app-admin
      dockerfile: Dockerfile
    container_name: cdc-app-admin
    ports:
      - "4102:80"
    depends_on:
      - cdc-app-api
    restart: always
    networks:
      - cdc-network

networks:
  cdc-network:
    driver: bridge

volumes:
  cdc-uploads:
  cdc-db-data:
